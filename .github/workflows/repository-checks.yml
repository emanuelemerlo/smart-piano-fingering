name: Repository checks

on:
  push:
  pull_request:

jobs:
  basic-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check required project files
        run: |
          test -s smart-piano-fingering.qml
          test -s smart-piano-fingering.png
          test -s README.md
          test -s LICENSE
          test -s CHANGELOG.md

      - name: Check basic QML structure
        run: |
          grep -F 'import MuseScore 3.0' smart-piano-fingering.qml
          grep -F 'function createSmartPianoFingeringCore()' smart-piano-fingering.qml
          grep -F 'function createMuseScoreAdapter(api)' smart-piano-fingering.qml

      - name: Unit tests
        run: node tests/run-tests.js
