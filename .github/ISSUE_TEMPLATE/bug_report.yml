name: Bug report
description: Report a reproducible problem with the plugin
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: input
    id: musescore
    attributes:
      label: MuseScore version
      placeholder: e.g. 4.x.y
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Plugin version
      placeholder: e.g. 1.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11, macOS, Linux
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: 1. Open a test score. 2. Launch the plugin. 3. Click Apply.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: MuseScore log / error message
      description: |
        If the plugin does not appear, does not open or shows an error, attach the latest MuseScore log.
        macOS: ~/Library/Application Support/MuseScore/MuseScore4/logs
        Windows: %LOCALAPPDATA%\MuseScore\MuseScore4\logs
        Linux: ~/.local/share/MuseScore/MuseScore4/logs
    validations:
      required: false
  - type: textarea
    id: score
    attributes:
      label: Relevant score details
      description: Mention staves, voices, ties, chords, and selection settings. Do not upload copyrighted or private scores without permission.
    validations:
      required: false
